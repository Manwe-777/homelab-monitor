# Copy to config.yaml and edit.

# Shown in the app
name: Homelab

# Your Nostr public key: only you can read this monitor's data and get its alerts
owner: npub1...

# Nostr relays, the app must use at least one of them
# relays:
#   - wss://relay.damus.io
#   - wss://nos.lol

# Defaults for every check (each check can override them)
interval: 60             # seconds between checks
timeout: 10              # seconds before a check fails
failuresBeforeAlert: 2   # failures in a row before alerting

# How often the monitor reports it's alive, in seconds
heartbeat: 300

# Channels group checks, the app chooses which channels notify each device
channels:
  - name: Dashboards
    checks:
      - name: Glance
        type: http
        # In Docker, services on this machine are at host.docker.internal
        url: http://host.docker.internal:8080
        # expectStatus: 200
        # contains: "Glance"

  - name: Infra
    checks:
      - name: SSH
        type: tcp
        host: host.docker.internal
        port: 22

      # Needs access to the Docker socket (user in the docker group)
      # - name: Jellyfin
      #   type: docker
      #   container: jellyfin

      # - name: Router admin
      #   type: http
      #   url: https://192.168.1.1
      #   insecure: true   # self-signed certificate

      # Free space on the filesystem holding a path
      - name: Root disk
        type: disk
        path: /data          # in Docker: the machine's disk, where the data dir lives
        maxUsedPercent: 90   # default 90
        # minFreeGb: 10
        # marker: MOUNTED    # a file that must exist: catches an unmounted share

      # A DNS server answers (and optionally with the right address)
      - name: Local DNS
        type: dns
        server: 192.168.1.1
        domain: example.com
        # expect: 93.184.215.14

  # Scheduled jobs report each run to a URL (`homelab-monitor heartbeats` shows
  # them). A failed run alerts right away, a missing one once it's overdue.
  - name: Jobs
    checks:
      - name: Nightly backup
        type: heartbeat
        every: 1d    # how often it runs (30m, 6h, 1d, 7d...)
        grace: 3h    # how late it may be (default 1h)

# Public status page (on by default, `statusPage: false` turns it off).
# Put it behind your reverse proxy, e.g. status.example.com -> http://THIS-MACHINE:3001
statusPage:
  port: 3001
  # host: 127.0.0.1      # default outside Docker; the Docker image listens on 0.0.0.0
  # title: My Homelab    # defaults to `name`
  # showTargets: false   # show URLs/hosts on the page (they're hidden by default)

# A channel with `public: false` notifies you but stays off the status page:
#   - name: Private
#     public: false
#     checks: [...]

# Where the app is hosted, for the links and QR codes `pair` shows
# appUrl: https://manwe-777.github.io/homelab-monitor/
