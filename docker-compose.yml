# The monitor and its status page. See "Set up your own" in the README.
#
#   mkdir -p data                 # the monitor runs as uid 1000
#   docker compose up -d          # the published image (--build to build it here)
#   docker compose exec monitor homelab-monitor pair
#
# Deployment specifics (where config and data live, ports) go in an
# override file: docker compose -f docker-compose.yml -f my.override.yml up -d
name: homelab-monitor

services:
  monitor:
    image: ghcr.io/manwe-777/homelab-monitor:latest
    build: .
    container_name: homelab-monitor
    restart: unless-stopped
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # Its keys and uptime history: keep it, or you'll have to pair again
      - ./data:/data
      # Only for `docker` checks. Anything that can talk to the Docker API
      # can own the host, so prefer http/tcp checks when you can.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3001:3001"   # status page
    extra_hosts:
      # Services published on the host: http://host.docker.internal:PORT
      - "host.docker.internal:host-gateway"
